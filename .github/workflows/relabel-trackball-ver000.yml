name: Relabel trackball add-on baseline to Ver000

on:
  push:
    branches:
      - relabel-trackball-ver000
    paths:
      - .github/workflows/relabel-trackball-ver000.yml

permissions:
  contents: write

jobs:
  relabel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: relabel-trackball-ver000

      - name: Relabel trackball add-on baseline
        shell: bash
        run: |
          set -euo pipefail

          test -d hardware/trackball-addon/Ver003
          test ! -e hardware/trackball-addon/Ver000

          mv hardware/trackball-addon/Ver003 hardware/trackball-addon/Ver000

          cat > hardware/trackball-addon/README.md <<'EOF'
          # Trackball add-on hardware

          This directory is the canonical location for the SplitChoc64 trackball add-on.

          ## Version baseline

          - Formal repository production version: **Ver000**
          - Legacy/internal package label: **Ver003**
          - Ver000 preserves the approved Ver003 payload unchanged; only repository-level version designation is changed.
          - Next trackball add-on revision: **Ver001**

          ## Mechanical baseline

          - Torabo-tsuki LP 19 mm holder geometry
          - 19.05 mm POM ball
          - PAW3222 14 mm mouse sensor module
          - dedicated R27 trackball adapter
          - trackball-enabled RIGHT bottom case

          ## FFC adapter

          The adapter PCB connects RIGHT J4 to a 6-pin 0.5 mm FFC connector.

          ### J4 mapping

          | J4 | Function |
          |---|---|
          | 1 | 3V3 |
          | 2 | GND |
          | 3 | SCLK / P0.02 |
          | 4 | SDIO / P0.03 |
          | 5 | MOTION / P0.28 |
          | 6 | CS / P0.04 |
          | 7 | SPARE / P0.05 |

          ### FFC-side mapping

          | J2 | Function |
          |---|---|
          | 1 | GND |
          | 2 | SCLK |
          | 3 | SDIO |
          | 4 | MOTION |
          | 5 | CS |
          | 6 | 3V3 |

          The physical connector orientation and same-side FFC contact direction must be checked during assembly; do not infer conductor order from the U-fold alone.

          ## Manufacturing baseline

          The approved adapter mechanical revision is R27. Reference assemblies are for fit/visualization only and are not themselves manufacturing parts.

          Legacy filenames and internal documents may still contain `Ver003`, `R27`, or `R26`; those names are intentionally retained for traceability to the approved manufacturing data.
          EOF

          cat > hardware/trackball-addon/Ver000/VERSION_MAP.md <<'EOF'
          # Trackball Add-on Version Map

          | Repository version | Legacy/internal label | Meaning |
          |---|---|---|
          | Ver000 | Ver003 | First approved/manufactured SplitChoc64 trackball add-on baseline |
          | Ver001 | — | Reserved for the first future trackball add-on revision |

          The Ver000 payload is intentionally preserved from the data previously managed as Trackball Add-on Ver003. Internal R27/R26 and Ver003 names are retained where present for traceability rather than rewritten.
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          old = '│  └─ trackball-addon/'
          new = '│  └─ trackball-addon/\n│     └─ Ver000/'
          if old in s and 'trackball-addon/\n│     └─ Ver000/' not in s:
              s = s.replace(old, new)
          marker = '## Versioning policy'
          if marker in s and 'Trackball add-on Ver000' not in s:
              s = s.replace(marker, marker + '\n\n- **Main PCB Ver000** = first manufactured main PCB baseline (legacy internal name: Ver012)\n- **Trackball add-on Ver000** = first approved trackball add-on baseline (legacy internal name: Ver003)\n')
          p.write_text(s)
          PY

      - name: Commit relabel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Relabel trackball add-on baseline as Ver000"
          git push origin HEAD:relabel-trackball-ver000
