name: Relabel production baseline to Ver000

on:
  push:
    branches:
      - relabel-production-ver000
    paths:
      - .github/workflows/relabel-ver000.yml

permissions:
  contents: write

jobs:
  relabel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: relabel-production-ver000

      - name: Relabel production baseline
        shell: bash
        run: |
          set -euo pipefail

          test -d hardware/main-pcb/Ver012
          test -d firmware/joystick/releases/Ver012
          test -f splitchoc64_Ver012.zip

          mv hardware/main-pcb/Ver012 hardware/main-pcb/Ver000
          mv firmware/joystick/releases/Ver012 firmware/joystick/releases/Ver000

          mkdir -p archive/original-import
          mv splitchoc64_Ver012.zip archive/original-import/splitchoc64_Ver012.zip

          rm -f .github/workflows/unpack-ver012.yml

          cat > hardware/main-pcb/Ver000/README.md <<'EOF'
          # SplitChoc64 Main PCB Ver000

          **Status: manufactured production baseline / frozen geometry**

          Ver000 is the formal production version for the first manufactured SplitChoc64 hardware baseline.

          This data set was originally developed and manufactured under the internal project label **Ver012**. The design contents are preserved unchanged; only the repository's formal version designation is now **Ver000**.

          ## Fixed geometry

          The following must not be changed in later add-on work:

          - PCB outline
          - key positions
          - mating/interlocking geometry between halves

          ## Contents

          This directory is the canonical location for the complete Ver000 hardware package:

          - KiCad project/source files
          - local symbols and footprints
          - Gerber and drill outputs
          - BOM / fabrication data
          - STEP references and case data
          - manufacturing ZIPs
          - validation and design notes
          - pinout and assembly documentation

          ## Legacy naming

          Some original filenames and internal documents still contain `Ver012`. Those names are intentionally retained to preserve traceability to the exact files used for the first manufacturing order.

          For repository-level versioning:

          - legacy `Ver012` = production **Ver000**
          - next hardware revision = **Ver001**

          The original uploaded archive is preserved under `archive/original-import/splitchoc64_Ver012.zip`.
          EOF

          cat > hardware/main-pcb/Ver000/VERSION_MAP.md <<'EOF'
          # Production Version Map

          | Repository version | Legacy/internal label | Meaning |
          |---|---|---|
          | Ver000 | Ver012 | First manufactured SplitChoc64 production hardware baseline |
          | Ver001 | — | Reserved for the first future hardware revision |

          The Ver000 design payload is intentionally preserved from the source package originally named `splitchoc64_Ver012.zip`. Legacy names inside KiCad files, validation documents, STEP filenames, and manufacturing outputs are retained for traceability rather than rewritten.
          EOF

          cat > archive/original-import/README.md <<'EOF'
          # Original import archive

          This directory preserves the original user-uploaded manufacturing source archive before repository relabeling.

          - Original filename: `splitchoc64_Ver012.zip`
          - Legacy/internal hardware label: `Ver012`
          - Formal repository production version: **Ver000**

          The archive is retained unchanged for traceability. The canonical extracted production data is under `hardware/main-pcb/Ver000/`.
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('Main PCB production baseline: **Ver012**', 'Main PCB production baseline: **Ver000**')
          s = s.replace('Ver012 PCB outline, key positions, and interlocking geometry are treated as frozen production geometry.', 'Ver000 corresponds to the hardware originally developed and manufactured under the internal label **Ver012**.\n- Ver000 PCB outline, key positions, and interlocking geometry are treated as frozen production geometry.')
          s = s.replace('│  │  └─ Ver012/', '│  │  └─ Ver000/')
          marker = '## Migration status'
          policy = '''## Versioning policy\n\n- **Ver000** = first manufactured SplitChoc64 production hardware baseline (legacy internal name: Ver012)\n- **Ver001** = first future hardware revision\n- Later revisions increment sequentially.\n\nLegacy filenames inside Ver000 may still contain `Ver012`; these are intentionally retained unchanged for traceability and to preserve the exact manufactured source data.\n\n'''
          if '## Versioning policy' not in s:
              s = s.replace(marker, policy + marker)
          p.write_text(s)
          PY

      - name: Commit relabel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Relabel first production hardware baseline as Ver000"
          git push origin HEAD:relabel-production-ver000
