name: Check Ver000 one-piece layout

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CAD kernel
        run: python3 -m pip install --user cadquery
      - name: Analyze assembled keyboard geometry
        shell: bash
        run: |
          python3 - <<'PY'
          import re, json, statistics
          from pathlib import Path
          import cadquery as cq

          pcb = {
            'LEFT': Path('hardware/main-pcb/Ver000/2_LEFT/SplitChoc64_LEFT.kicad_pcb'),
            'RIGHT': Path('hardware/main-pcb/Ver000/1_RIGHT/SplitChoc64_RIGHT.kicad_pcb'),
          }

          def blocks(text):
              out=[]; i=0
              while True:
                  s=text.find('(footprint',i)
                  if s<0: break
                  depth=0; ins=False; esc=False
                  for j in range(s,len(text)):
                      c=text[j]
                      if ins:
                          if esc: esc=False
                          elif c=='\\': esc=True
                          elif c=='"': ins=False
                      else:
                          if c=='"': ins=True
                          elif c=='(': depth+=1
                          elif c==')':
                              depth-=1
                              if depth==0:
                                  out.append(text[s:j+1]); i=j+1; break
                  else: break
              return out

          def ref_at(b):
              m=re.search(r'\(property\s+"Reference"\s+"([^"]+)"',b) or re.search(r'\(fp_text\s+reference\s+"?([^"\s\)]+)',b)
              a=re.search(r'\(at\s+(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)',b[:1500])
              if not (m and a): return None
              return m.group(1),float(a.group(1)),float(a.group(2))

          sw={}
          for side,p in pcb.items():
              arr=[]
              for b in blocks(p.read_text(errors='replace')):
                  ra=ref_at(b)
                  if not ra: continue
                  ref,x,y=ra
                  if side=='LEFT' and re.fullmatch(r'SWL\d+',ref): arr.append((ref,x,y))
                  if side=='RIGHT' and re.fullmatch(r'SWR\d+',ref): arr.append((ref,x,y))
              sw[side]=arr

          def rows(arr,tol=0.05):
              groups=[]
              for q in sorted(arr,key=lambda z:z[2]):
                  for g in groups:
                      if abs(q[2]-statistics.mean(v[2] for v in g))<=tol:
                          g.append(q); break
                  else: groups.append([q])
              return groups

          lr=rows(sw['LEFT']); rr=rows(sw['RIGHT'])
          pairs=[]
          for lrow in lr:
              ly=statistics.mean(v[2] for v in lrow)
              rrow=min(rr,key=lambda g:abs(statistics.mean(v[2] for v in g)-ly))
              ry=statistics.mean(v[2] for v in rrow)
              if abs(ry-ly)>0.1: continue
              l=max(lrow,key=lambda v:v[1]); r=min(rrow,key=lambda v:v[1])
              gap=r[1]-l[1]
              pairs.append({'y_mm':ly,'left_ref':l[0],'left_x_mm':l[1],'right_ref':r[0],'right_x_mm':r[1],'current_gap_mm':gap,'shift_right_for_19_05_mm':19.05-gap})

          # Use the four ordinary alpha/number rows, excluding the bottom thumb/space row.
          main_pairs=[p for p in pairs if p['y_mm'] < 100]
          shift=statistics.mean(p['shift_right_for_19_05_mm'] for p in main_pairs)

          left_case=cq.importers.importStep('hardware/main-pcb/Ver000/4_CASE/SplitChoc64_LEFT_BOTTOM_CASE_Ver010.step').val()
          right_case=cq.importers.importStep('hardware/main-pcb/Ver000/4_CASE/SplitChoc64_RIGHT_BOTTOM_CASE_Ver010.step').val()
          moved=right_case.translate((shift,0,0))
          inter=left_case.intersect(moved)
          vol=inter.Volume()
          dist=left_case.distance(moved)
          ib=None
          if vol>1e-9:
              b=inter.BoundingBox(); ib={'xmin':b.xmin,'xmax':b.xmax,'ymin':b.ymin,'ymax':b.ymax,'zmin':b.zmin,'zmax':b.zmax,'xlen':b.xlen,'ylen':b.ylen,'zlen':b.zlen}

          result={
            'switch_count_left':len(sw['LEFT']),
            'switch_count_right':len(sw['RIGHT']),
            'seam_switch_pairs':pairs,
            'required_right_translation_mm':shift,
            'target_main_row_pitch_mm':19.05,
            'case_intersection_volume_at_onepiece_position_mm3':vol,
            'case_minimum_distance_at_onepiece_position_mm':dist,
            'case_intersection_bbox_mm':ib,
            'onepiece_case_fit':'INTERFERENCE' if vol>1e-9 else ('TOUCHING' if dist<=1e-6 else 'CLEARANCE')
          }
          print('ONEPIECE_FINAL_RESULT_BEGIN')
          print(json.dumps(result,indent=2))
          print('ONEPIECE_FINAL_RESULT_END')
          PY
