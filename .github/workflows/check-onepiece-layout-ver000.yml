name: Check Ver000 one-piece layout

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze switch centers across split
        shell: bash
        run: |
          python3 - <<'PY'
          import re, json, math
          from pathlib import Path

          files = {
            'LEFT': Path('hardware/main-pcb/Ver000/2_LEFT/SplitChoc64_LEFT.kicad_pcb'),
            'RIGHT': Path('hardware/main-pcb/Ver000/1_RIGHT/SplitChoc64_RIGHT.kicad_pcb'),
          }

          def extract_footprints(text):
              out=[]; i=0
              while True:
                  s=text.find('(footprint', i)
                  if s<0: break
                  depth=0; in_str=False; esc=False; e=None
                  for j in range(s, len(text)):
                      c=text[j]
                      if in_str:
                          if esc: esc=False
                          elif c=='\\': esc=True
                          elif c=='"': in_str=False
                      else:
                          if c=='"': in_str=True
                          elif c=='(': depth+=1
                          elif c==')':
                              depth-=1
                              if depth==0:
                                  e=j+1; break
                  if e is None: break
                  out.append(text[s:e]); i=e
              return out

          def get_ref(block):
              patterns=[
                r'\(property\s+"Reference"\s+"([^"]+)"',
                r'\(fp_text\s+reference\s+"([^"]+)"',
                r'\(fp_text\s+reference\s+([^\s\)]+)',
              ]
              for pat in patterns:
                  m=re.search(pat,block)
                  if m:return m.group(1)
              return None

          def get_value(block):
              for pat in [r'\(property\s+"Value"\s+"([^"]+)"',r'\(fp_text\s+value\s+"([^"]+)"']:
                  m=re.search(pat,block)
                  if m:return m.group(1)
              return ''

          def get_name(block):
              m=re.match(r'\(footprint\s+"([^"]+)"',block)
              return m.group(1) if m else ''

          def get_at(block):
              # placement line is before graphical primitives; search first 1.5 kB
              m=re.search(r'\(at\s+(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)(?:\s+(-?\d+(?:\.\d+)?))?\)',block[:1500])
              if not m:return None
              return (float(m.group(1)),float(m.group(2)),float(m.group(3) or 0))

          data={}; inventory={}
          for side,p in files.items():
              text=p.read_text(errors='replace')
              sw=[]; inv=[]
              for b in extract_footprints(text):
                  ref=get_ref(b); name=get_name(b); val=get_value(b); at=get_at(b)
                  if ref and at: inv.append({'ref':ref,'name':name,'value':val,'x':at[0],'y':at[1]})
                  hay=(name+' '+val).lower()
                  # Key switch footprint identification by footprint/value semantics, independent of reference prefix.
                  if at and any(k in hay for k in ['choc','pg135','keyswitch','key_switch','switch_socket']):
                      sw.append({'ref':ref or '?','name':name,'value':val,'x':at[0],'y':at[1],'rot':at[2]})
              data[side]=sorted(sw,key=lambda q:(q['y'],q['x']))
              inventory[side]=inv

          # If semantic match fails, show inventory to diagnose exact library naming.
          if not data['LEFT'] or not data['RIGHT']:
              print('FOOTPRINT_INVENTORY_BEGIN')
              print(json.dumps(inventory,indent=2))
              print('FOOTPRINT_INVENTORY_END')

          def cluster_rows(items,tol=0.6):
              rows=[]
              for q in sorted(items,key=lambda z:z['y']):
                  for r in rows:
                      cy=sum(x['y'] for x in r)/len(r)
                      if abs(q['y']-cy)<=tol:
                          r.append(q); break
                  else: rows.append([q])
              return rows

          Lrows=cluster_rows(data['LEFT']); Rrows=cluster_rows(data['RIGHT'])
          pairs=[]
          for lr in Lrows:
              ly=sum(q['y'] for q in lr)/len(lr)
              if not Rrows: continue
              rr=min(Rrows,key=lambda r:abs(sum(q['y'] for q in r)/len(r)-ly))
              ry=sum(q['y'] for q in rr)/len(rr)
              l=max(lr,key=lambda q:q['x']); r=min(rr,key=lambda q:q['x'])
              dx=r['x']-l['x']; dy=r['y']-l['y']; d=math.hypot(dx,dy)
              pairs.append({'left_ref':l['ref'],'left_xy':[l['x'],l['y']], 'right_ref':r['ref'],'right_xy':[r['x'],r['y']], 'row_y_left':ly,'row_y_right':ry,'dx_mm':dx,'dy_mm':dy,'center_distance_mm':d,'pitch_error_vs_19_05_mm':d-19.05})

          print('ONEPIECE_LAYOUT_RESULT_BEGIN')
          print(json.dumps({'switch_count_left':len(data['LEFT']),'switch_count_right':len(data['RIGHT']),'seam_pairs_by_row':pairs,'left_switches':data['LEFT'],'right_switches':data['RIGHT']},indent=2))
          print('ONEPIECE_LAYOUT_RESULT_END')
          PY
