name: Inspect FFC placement
on:
  push:
    paths:
      - '.github/workflows/inspect-ffc-placement.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect and publish J3 J4 neighborhoods
        shell: python
        run: |
          from pathlib import Path
          import re, math
          targets=[('LEFT',Path('DEVELOPMENT/Ver001/LEFT/SplitChoc64_LEFT.kicad_pcb'),'J3'),('RIGHT',Path('DEVELOPMENT/Ver001/RIGHT/SplitChoc64_RIGHT.kicad_pcb'),'J4')]
          def blocks(text,head):
              out=[]; pos=0
              while True:
                  s=text.find(head,pos)
                  if s<0: break
                  d=0; ins=False; esc=False; e=None
                  for i in range(s,len(text)):
                      c=text[i]
                      if ins:
                          if esc: esc=False
                          elif c=='\\': esc=True
                          elif c=='"': ins=False
                          continue
                      if c=='"': ins=True
                      elif c=='(': d+=1
                      elif c==')':
                          d-=1
                          if d==0: e=i+1; break
                  if e is None: break
                  out.append(text[s:e]); pos=e
              return out
          def fpinfo(b):
              r=re.search(r'\(property "Reference" "([^"]+)"',b)
              a=re.search(r'\n\s*\(at\s+([-0-9.]+)\s+([-0-9.]+)(?:\s+([-0-9.]+))?\)',b[:2500])
              l=re.search(r'\n\s*\(layer "([FB]\.Cu)"\)',b[:1000]); n=re.match(r'\(footprint "([^"]+)"',b)
              return None if not(r and a) else (r.group(1),float(a.group(1)),float(a.group(2)),float(a.group(3) or 0),l.group(1) if l else '?',n.group(1) if n else '?')
          lines=[]
          for side,path,ref in targets:
              text=path.read_text(); infos=[x for b in blocks(text,'(footprint ') if (x:=fpinfo(b))]
              t=next(x for x in infos if x[0]==ref); tx,ty=t[1],t[2]
              lines += [f'=== {side} {ref} at=({tx:.3f},{ty:.3f}) rot={t[3]} layer={t[4]} ===','FOOTPRINTS within 30mm:']
              for x in sorted(infos,key=lambda x:math.hypot(x[1]-tx,x[2]-ty)):
                  d=math.hypot(x[1]-tx,x[2]-ty)
                  if d<=30: lines.append(f'{x[0]} x={x[1]:.3f} y={x[2]:.3f} rot={x[3]:.1f} layer={x[4]} d={d:.2f} lib={x[5]}')
              lines.append('EDGE.CUTS nearby:')
              for h in ('(gr_line ','(gr_arc '):
                  for b in blocks(text,h):
                      if '(layer "Edge.Cuts")' not in b: continue
                      pts=[(float(a),float(c)) for a,c in re.findall(r'\((?:start|end|mid|center)\s+([-0-9.]+)\s+([-0-9.]+)',b)]
                      if pts and any(abs(x-tx)<=30 and abs(y-ty)<=30 for x,y in pts): lines.append(re.sub(r'\s+',' ',b[:500]))
              lines.append('SEGMENTS/VIAS within 18mm:')
              for h in ('(segment ','(via '):
                  for b in blocks(text,h):
                      pts=[(float(a),float(c)) for a,c in re.findall(r'\((?:start|end|at)\s+([-0-9.]+)\s+([-0-9.]+)',b)]
                      if pts and any(math.hypot(x-tx,y-ty)<=18 for x,y in pts): lines.append(re.sub(r'\s+',' ',b[:400]))
              lines.append('')
          Path('DEVELOPMENT/Ver001/FFC_PLACEMENT_INSPECT.txt').write_text('\n'.join(lines)+'\n')
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT/Ver001/FFC_PLACEMENT_INSPECT.txt
          git commit -m "Add temporary FFC placement inspection report"
          git push
