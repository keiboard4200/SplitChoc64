name: Stage parallel trackball FFC connectors
on:
  push:
    paths:
      - '.github/workflows/inspect-ffc-placement.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add FFC footprints and parallel routing
        shell: python
        run: |
          from pathlib import Path
          import re, uuid
          def blocks(text, head):
              out=[]; pos=0
              while True:
                  s=text.find(head,pos)
                  if s<0: break
                  d=0; ins=False; esc=False; e=None
                  for i in range(s,len(text)):
                      c=text[i]
                      if ins:
                          if esc: esc=False
                          elif c=='\\': esc=True
                          elif c=='"': ins=False
                          continue
                      if c=='"': ins=True
                      elif c=='(': d+=1
                      elif c==')':
                          d-=1
                          if d==0: e=i+1; break
                  if e is None: raise RuntimeError('unterminated s-expression')
                  out.append(text[s:e]); pos=e
              return out
          def extract_ref_footprint(text, ref):
              for b in blocks(text,'(footprint'):
                  if f'(property "Reference" "{ref}"' in b: return b
              raise RuntimeError(f'footprint {ref} not found')
          adapter=Path('hardware/trackball-addon/Ver000/1_FFC_ADAPTER/SplitChoc64_FFC_Adapter.kicad_pcb').read_text()
          template=extract_ref_footprint(adapter,'J2')
          def uid(): return str(uuid.uuid4())
          def net_id(text,name):
              m=re.search(rf'\(net\s+(\d+)\s+"{re.escape(name)}"\)',text)
              if not m: raise RuntimeError(f'net not found: {name}')
              return int(m.group(1))
          def seg(a,b,net,layer='B.Cu',width=0.15):
              return f'\t(segment\n\t\t(start {a[0]} {a[1]})\n\t\t(end {b[0]} {b[1]})\n\t\t(width {width})\n\t\t(layer "{layer}")\n\t\t(net {net})\n\t\t(uuid "{uid()}")\n\t)\n'
          def via(p,net):
              return f'\t(via\n\t\t(at {p[0]} {p[1]})\n\t\t(size 0.45)\n\t\t(drill 0.2)\n\t\t(layers "F.Cu" "B.Cu")\n\t\t(net {net})\n\t\t(uuid "{uid()}")\n\t)\n'
          def poly(points,net,layer='B.Cu'): return ''.join(seg(a,b,net,layer) for a,b in zip(points,points[1:]))
          specs={
            'LEFT':{'path':Path('DEVELOPMENT/Ver001/LEFT/SplitChoc64_LEFT.kicad_pcb'),'ref':'J5','at':(118.5,112.8),'names':['L_GND','L_JOY_X','L_JOY_Y','L_JOY_SW','L_JOY_SDA','L_3V3'],'sources':[(122.75,115.85),(123.25,115.85),(123.75,115.85),(124.25,115.85),(124.75,115.85),(125.25,115.85)]},
            'RIGHT':{'path':Path('DEVELOPMENT/Ver001/RIGHT/SplitChoc64_RIGHT.kicad_pcb'),'ref':'J6','at':(194.7,112.0),'names':['R_GND','R_JOY_X','R_JOY_Y','R_JOY_SW','R_JOY_SDA','R_3V3'],'sources':[(198.95,115.05),(199.45,115.05),(199.95,115.05),(200.45,115.05),(200.95,115.05),(201.45,115.05)]}}
          old_names=['GND','PAW_SCLK','PAW_SDIO','PAW_MOTION','PAW_CS','3V3']
          for side,s in specs.items():
              text=s['path'].read_text()
              if f'(property "Reference" "{s["ref"]}"' in text: raise RuntimeError(f'{side} {s["ref"]} already exists')
              nids={name:net_id(text,name) for name in s['names']}
              fp=template
              fp=re.sub(r'^\(footprint "[^"]+"','(footprint "SplitChoc64_FFC:FH19C-6S-0.5SH_HandSolder"',fp,count=1)
              fp=re.sub(r'\n\s*\(at\s+0\s+0\)',f'\n\t\t(at {s["at"][0]} {s["at"][1]})',fp,count=1)
              fp=fp.replace('(property "Reference" "J2"',f'(property "Reference" "{s["ref"]}"',1)
              fp=re.sub(r'\(uuid "[0-9a-f-]+"\)',lambda m:f'(uuid "{uid()}")',fp)
              for old,new in zip(old_names,s['names']): fp=re.sub(rf'\(net\s+\d+\s+"{re.escape(old)}"\)',f'(net {nids[new]} "{new}")',fp)
              insert=min((p for p in [text.find('\n\t(gr_line'),text.find('\n\t(gr_arc'),text.find('\n\t(gr_text')] if p>=0),default=-1)
              if insert<0: raise RuntimeError('graphics insertion point not found')
              text=text[:insert]+'\n\t'+fp.replace('\n','\n\t').rstrip('\t')+'\n'+text[insert:]
              routing='\n'
              if side=='LEFT':
                  routing+=poly([(122.75,115.85),(122.0,116.3),(121.5,116.3),(121.5,113.0),(130.91,113.0)],nids['L_GND'])
                  vias=[(123.3,115.35),(123.9,114.85),(124.5,114.35),(125.1,113.85)]
                  tracks=[(123.3,115.5474),(123.9,115.0957),(124.5,114.6199),(126.6,114.3182)]
                  for src,v,name,t in zip(s['sources'][1:5],vias,s['names'][1:5],tracks):
                      routing+=seg(src,v,nids[name])+via(v,nids[name])
                      if name=='L_JOY_SDA': routing+=seg(v,(126.6,113.85),nids[name],'F.Cu')+seg((126.6,113.85),t,nids[name],'F.Cu')
                      else: routing+=seg(v,t,nids[name],'F.Cu')
                  routing+=seg((125.25,115.85),(129.64,115.5),nids['L_3V3'])
              else:
                  rv=[(198.0,110.0949),(198.8,110.3966),(199.8,114.3),(200.4,114.72),(201.0,114.98),(201.6,115.4)]
                  for src,v,name in zip(s['sources'],rv,s['names']): routing+=seg(src,v,nids[name])+via(v,nids[name])
                  for a,b,name in [((199.8,114.3),(199.8,114.5693),'R_JOY_Y'),((200.4,114.72),(200.4,114.871),'R_JOY_SW'),((201.0,114.98),(201.0,115.1727),'R_JOY_SDA'),((201.6,115.4),(201.6,115.6065),'R_3V3')]: routing+=seg(a,b,nids[name],'F.Cu')
              pos=text.rfind('\n\t(embedded_fonts no)')
              if pos<0: raise RuntimeError('final insertion point not found')
              text=text[:pos]+routing+text[pos:]
              s['path'].write_text(text)
          lib=Path('DEVELOPMENT/Ver001/0_COMMON/SplitChoc64_FFC.pretty'); lib.mkdir(parents=True,exist_ok=True)
          source=Path('hardware/trackball-addon/Ver000/1_FFC_ADAPTER/SplitChoc64.pretty/FH19C-6S-0.5SH_HandSolder.kicad_mod').read_text()
          (lib/'FH19C-6S-0.5SH_HandSolder.kicad_mod').write_text(source)
          for side in ('LEFT','RIGHT'):
              p=Path(f'DEVELOPMENT/Ver001/{side}/fp-lib-table'); t=p.read_text()
              if 'SplitChoc64_FFC' not in t:
                  line='  (lib (name "SplitChoc64_FFC")(type "KiCad")(uri "${KIPRJMOD}/../0_COMMON/SplitChoc64_FFC.pretty")(options "")(descr "Trackball FFC connector"))\n'
                  p.write_text(t.replace('\n)\n','\n'+line+')\n'))
      - name: Validate generated text structure
        shell: python
        run: |
          from pathlib import Path
          for side,ref in [('LEFT','J5'),('RIGHT','J6')]:
              p=Path(f'DEVELOPMENT/Ver001/{side}/SplitChoc64_{side}.kicad_pcb')
              t=p.read_text()
              depth=0; ins=False; esc=False
              for c in t:
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                  elif c=='"': ins=True
                  elif c=='(': depth+=1
                  elif c==')': depth-=1
                  if depth<0: raise SystemExit(f'{side}: negative paren depth')
              if depth!=0 or ins: raise SystemExit(f'{side}: malformed s-expression depth={depth}')
              if f'(property "Reference" "{ref}"' not in t: raise SystemExit(f'{side}: FFC ref missing')
              print(side, 'structure OK', 'bytes', len(t))
      - name: Commit staged board changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT/Ver001/LEFT/SplitChoc64_LEFT.kicad_pcb DEVELOPMENT/Ver001/RIGHT/SplitChoc64_RIGHT.kicad_pcb DEVELOPMENT/Ver001/LEFT/fp-lib-table DEVELOPMENT/Ver001/RIGHT/fp-lib-table DEVELOPMENT/Ver001/0_COMMON/SplitChoc64_FFC.pretty/FH19C-6S-0.5SH_HandSolder.kicad_mod
          git commit -m "Stage parallel trackball FFC connectors in Ver001"
          git push
