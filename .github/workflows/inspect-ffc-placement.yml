name: Package current Ver001 FFC unrouted data
on:
  push:
    paths:
      - '.github/workflows/inspect-ffc-placement.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare package
        run: |
          mkdir -p package
          cp -a DEVELOPMENT/Ver001 package/Ver001
          rm -f package/Ver001/FFC_DRC_CHECK.txt package/Ver001/FFC_PLACEMENT_INSPECT.txt
          printf '%s\n' 'SplitChoc64 Ver001 - FFC footprints added, FFC nets intentionally unrouted for Freerouting.' > package/README_FREEROUTING.txt
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: SplitChoc64_Ver001_FFC_UNROUTED
          path: package/
          compression-level: 9
