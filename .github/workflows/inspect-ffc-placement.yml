name: TEMP Inspect Ver001 3D payload
on:
  push:
    paths:
      - '.github/workflows/inspect-ffc-placement.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect staged exact 3D payload
        shell: bash
        run: |
          set -euxo pipefail
          cat DEVELOPMENT/Ver001/.3d_payload/part*.b64 > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.xz
          xz -t /tmp/payload.xz
          xz -dc /tmp/payload.xz > /tmp/payload.raw
          echo "RAW_SIZE=$(stat -c%s /tmp/payload.raw)"
          echo "RAW_SHA256=$(sha256sum /tmp/payload.raw | cut -d' ' -f1)"
          file /tmp/payload.raw
          echo '--- HEX ---'
          xxd -l 128 /tmp/payload.raw
          echo '--- TAR ---'
          tar -tvf /tmp/payload.raw || true
          echo '--- ZIP ---'
          unzip -l /tmp/payload.raw || true
          echo '--- STRINGS ---'
          strings /tmp/payload.raw | head -120 || true
