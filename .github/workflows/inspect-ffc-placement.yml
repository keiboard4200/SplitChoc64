name: Restore footprint-only Ver001 FFC state
on:
  push:
    paths:
      - '.github/workflows/inspect-ffc-placement.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore un-routed FFC PCB state
        run: |
          git checkout 2dd0688ed56775100c838c6da532f15935b4b0af -- \
            DEVELOPMENT/Ver001/LEFT/SplitChoc64_LEFT.kicad_pcb \
            DEVELOPMENT/Ver001/RIGHT/SplitChoc64_RIGHT.kicad_pcb \
            DEVELOPMENT/Ver001/FFC_DRC_CHECK.txt
      - name: Commit footprint-only state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT/Ver001/LEFT/SplitChoc64_LEFT.kicad_pcb DEVELOPMENT/Ver001/RIGHT/SplitChoc64_RIGHT.kicad_pcb DEVELOPMENT/Ver001/FFC_DRC_CHECK.txt
          git commit -m "Restore un-routed FFC footprints for Freerouting"
          git push
