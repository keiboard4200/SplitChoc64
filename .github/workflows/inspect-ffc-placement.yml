name: Rebuild clean Ver001 FFC placement
on:
  push:
    paths:
      - '.github/workflows/inspect-ffc-placement.yml'
concurrency:
  group: ver001-ffc-rebuild
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore DRC-clean Ver001 PCB baseline
        run: |
          git checkout a2189b1510437ab9d1b4cf62ddab45240bf99cb0 -- \
            DEVELOPMENT/Ver001/LEFT/SplitChoc64_LEFT.kicad_pcb \
            DEVELOPMENT/Ver001/RIGHT/SplitChoc64_RIGHT.kicad_pcb \
            DEVELOPMENT/Ver001/LEFT/fp-lib-table \
            DEVELOPMENT/Ver001/RIGHT/fp-lib-table
      - name: Add FFC footprints only
        shell: python
        run: |
          from pathlib import Path
          import re, uuid
          def blocks(text,head):
              out=[]; pos=0
              while True:
                  s=text.find(head,pos)
                  if s<0: break
                  d=0; ins=False; esc=False; e=None
                  for i in range(s,len(text)):
                      c=text[i]
                      if ins:
                          if esc: esc=False
                          elif c=='\\': esc=True
                          elif c=='"': ins=False
                          continue
                      if c=='"': ins=True
                      elif c=='(': d+=1
                      elif c==')':
                          d-=1
                          if d==0: e=i+1; break
                  if e is None: raise RuntimeError('unterminated')
                  out.append(text[s:e]); pos=e
              return out
          def get_ref(text,ref):
              for b in blocks(text,'(footprint'):
                  if f'(property "Reference" "{ref}"' in b: return b
              raise RuntimeError(ref)
          def net_id(text,name):
              m=re.search(rf'\(net\s+(\d+)\s+"{re.escape(name)}"\)',text)
              if not m: raise RuntimeError(name)
              return int(m.group(1))
          def uid(): return str(uuid.uuid4())
          adapter=Path('hardware/trackball-addon/Ver000/1_FFC_ADAPTER/SplitChoc64_FFC_Adapter.kicad_pcb').read_text()
          template=get_ref(adapter,'J2')
          specs={
            'LEFT':(Path('DEVELOPMENT/Ver001/LEFT/SplitChoc64_LEFT.kicad_pcb'),'J5',(118.5,112.8),['L_GND','L_JOY_X','L_JOY_Y','L_JOY_SW','L_JOY_SDA','L_3V3']),
            'RIGHT':(Path('DEVELOPMENT/Ver001/RIGHT/SplitChoc64_RIGHT.kicad_pcb'),'J6',(194.7,112.0),['R_GND','R_JOY_X','R_JOY_Y','R_JOY_SW','R_JOY_SDA','R_3V3'])}
          old=['GND','PAW_SCLK','PAW_SDIO','PAW_MOTION','PAW_CS','3V3']
          for side,(p,ref,at,names) in specs.items():
              text=p.read_text(); ids={n:net_id(text,n) for n in names}; fp=template
              fp=re.sub(r'^\(footprint "[^"]+"','(footprint "SplitChoc64_FFC:FH19C-6S-0.5SH_HandSolder"',fp,count=1)
              fp=re.sub(r'\n\s*\(at\s+[-0-9.]+\s+[-0-9.]+(?:\s+[-0-9.]+)?\)',f'\n\t\t(at {at[0]} {at[1]})',fp,count=1)
              fp=fp.replace('(property "Reference" "J2"',f'(property "Reference" "{ref}"',1)
              fp=re.sub(r'\(uuid "[0-9a-f-]+"\)',lambda m:f'(uuid "{uid()}")',fp)
              for a,b in zip(old,names): fp=re.sub(rf'\(net\s+\d+\s+"{re.escape(a)}"\)',f'(net {ids[b]} "{b}")',fp)
              insert=min(x for x in [text.find('\n\t(gr_line'),text.find('\n\t(gr_arc'),text.find('\n\t(gr_text')] if x>=0)
              p.write_text(text[:insert]+'\n\t'+fp.replace('\n','\n\t').rstrip('\t')+'\n'+text[insert:])
          lib=Path('DEVELOPMENT/Ver001/0_COMMON/SplitChoc64_FFC.pretty'); lib.mkdir(parents=True,exist_ok=True)
          src=Path('hardware/trackball-addon/Ver000/1_FFC_ADAPTER/SplitChoc64.pretty/FH19C-6S-0.5SH_HandSolder.kicad_mod').read_text()
          (lib/'FH19C-6S-0.5SH_HandSolder.kicad_mod').write_text(src)
          for side in ('LEFT','RIGHT'):
              p=Path(f'DEVELOPMENT/Ver001/{side}/fp-lib-table'); t=p.read_text()
              line='  (lib (name "SplitChoc64_FFC")(type "KiCad")(uri "${KIPRJMOD}/../0_COMMON/SplitChoc64_FFC.pretty")(options "")(descr "Trackball FFC connector"))\n'
              if 'SplitChoc64_FFC' not in t: p.write_text(t.replace('\n)\n','\n'+line+')\n'))
      - name: Install KiCad 9
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
      - name: DRC footprint placement only
        shell: bash
        run: |
          set +e
          kicad-cli pcb drc --exit-code-violations -o /tmp/L.rpt DEVELOPMENT/Ver001/LEFT/SplitChoc64_LEFT.kicad_pcb; l=$?
          kicad-cli pcb drc --exit-code-violations -o /tmp/R.rpt DEVELOPMENT/Ver001/RIGHT/SplitChoc64_RIGHT.kicad_pcb; r=$?
          { echo '=== CLEAN REBUILD / FFC FOOTPRINT ONLY ==='; echo "LEFT_EXIT=$l"; cat /tmp/L.rpt; echo; echo "RIGHT_EXIT=$r"; cat /tmp/R.rpt; } > DEVELOPMENT/Ver001/FFC_DRC_CHECK.txt
      - name: Commit clean footprint-only state and report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT/Ver001/LEFT/SplitChoc64_LEFT.kicad_pcb DEVELOPMENT/Ver001/RIGHT/SplitChoc64_RIGHT.kicad_pcb DEVELOPMENT/Ver001/LEFT/fp-lib-table DEVELOPMENT/Ver001/RIGHT/fp-lib-table DEVELOPMENT/Ver001/0_COMMON/SplitChoc64_FFC.pretty/FH19C-6S-0.5SH_HandSolder.kicad_mod DEVELOPMENT/Ver001/FFC_DRC_CHECK.txt
          git commit -m "Rebuild clean Ver001 FFC footprint placement and DRC"
          git push
