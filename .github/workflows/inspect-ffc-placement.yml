name: Validate staged Ver001 FFC changes
on:
  push:
    paths:
      - '.github/workflows/inspect-ffc-placement.yml'
permissions:
  contents: write
jobs:
  drc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
          kicad-cli --version
      - name: Run LEFT and RIGHT PCB DRC
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/drc
          kicad-cli pcb drc --exit-code-violations -o /tmp/drc/LEFT.rpt DEVELOPMENT/Ver001/LEFT/SplitChoc64_LEFT.kicad_pcb
          left_rc=$?
          kicad-cli pcb drc --exit-code-violations -o /tmp/drc/RIGHT.rpt DEVELOPMENT/Ver001/RIGHT/SplitChoc64_RIGHT.kicad_pcb
          right_rc=$?
          {
            echo '=== KiCad 9 Ver001 FFC validation ==='
            echo "LEFT_EXIT=$left_rc"
            cat /tmp/drc/LEFT.rpt
            echo
            echo "RIGHT_EXIT=$right_rc"
            cat /tmp/drc/RIGHT.rpt
          } > DEVELOPMENT/Ver001/FFC_DRC_CHECK.txt
          cat DEVELOPMENT/Ver001/FFC_DRC_CHECK.txt
      - name: Publish DRC report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT/Ver001/FFC_DRC_CHECK.txt
          git commit -m "Publish staged FFC KiCad DRC report"
          git push
