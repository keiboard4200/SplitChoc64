name: Make Ver001.001 PCB only
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate PCB files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib, json

          jobs = {
            'LEFT': {
              'src': Path('hardware/main-pcb/Ver000/2_LEFT/SplitChoc64_LEFT.kicad_pcb'),
              'out': Path('out/SplitChoc64_LEFT_Ver001.001.kicad_pcb'),
              'map': {
                (136.050,20.25):(134.850,20.25),
                (136.050,39.30):(134.850,40.70),
                (145.575,39.30):(144.375,40.70),
                (145.575,58.35):(144.375,59.55),
                (150.337,58.35):(149.137,59.55),
                (150.337,77.40):(149.137,78.60),
                (159.863,77.40):(158.663,78.60),
                (159.863,97.95):(158.663,96.55),
                (150.338,97.95):(149.138,96.55),
                (150.338,117.00):(149.138,117.00),
              },
            },
            'RIGHT': {
              'src': Path('hardware/main-pcb/Ver000/1_RIGHT/SplitChoc64_RIGHT.kicad_pcb'),
              'out': Path('out/SplitChoc64_RIGHT_Ver001.001.kicad_pcb'),
              'map': {
                (152.863,20.25):(154.063,20.25),
                (152.863,39.30):(154.063,37.90),
                (162.388,39.30):(163.588,37.90),
                (162.388,58.35):(163.588,57.15),
                (167.150,58.35):(168.350,57.15),
                (167.150,77.40):(168.350,76.20),
                (176.675,77.40):(177.875,76.20),
                (176.675,97.95):(177.875,99.35),
                (167.151,97.95):(168.351,99.35),
                (167.151,117.00):(168.351,117.00),
              },
            },
          }

          def blocks(text, head='gr_line'):
              needle='('+head; i=0
              while True:
                  s=text.find(needle,i)
                  if s<0: return
                  depth=0; ins=False; esc=False
                  for j in range(s,len(text)):
                      c=text[j]
                      if ins:
                          if esc: esc=False
                          elif c=='\\': esc=True
                          elif c=='"': ins=False
                      else:
                          if c=='"': ins=True
                          elif c=='(': depth+=1
                          elif c==')':
                              depth-=1
                              if depth==0:
                                  yield s,j+1,text[s:j+1]
                                  i=j+1
                                  break
                  else: return

          pt_re = re.compile(r'\((start|end)\s+(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)\)')
          def key(x,y): return (round(float(x),6), round(float(y),6))
          def fmt(v): return f'{v:.6f}'.rstrip('0').rstrip('.')

          Path('out').mkdir(exist_ok=True)
          report={}
          for side,cfg in jobs.items():
              text=cfg['src'].read_text(encoding='utf-8')
              mp={key(*a):b for a,b in cfg['map'].items()}
              pieces=[]; pos=0; changed_blocks=0; counter=[0]
              for s,e,b in blocks(text):
                  pieces.append(text[pos:s]); nb=b
                  if '(layer "Edge.Cuts")' in b:
                      def repl(m):
                          old=key(m.group(2),m.group(3))
                          if old not in mp: return m.group(0)
                          nx,ny=mp[old]; counter[0]+=1
                          return f'({m.group(1)} {fmt(nx)} {fmt(ny)})'
                      nb=pt_re.sub(repl,b)
                      if nb!=b: changed_blocks+=1
                  pieces.append(nb); pos=e
              pieces.append(text[pos:]); new=''.join(pieces)
              cfg['out'].write_text(new,encoding='utf-8',newline='')

              def normalize_edge_coords(t):
                  out=[]; p=0
                  for s,e,b in blocks(t):
                      out.append(t[p:s])
                      if '(layer "Edge.Cuts")' in b:
                          b=pt_re.sub(lambda m:f'({m.group(1)} <EDGEPT> <EDGEPT>)',b)
                      out.append(b); p=e
                  out.append(t[p:]); return ''.join(out)
              same_elsewhere=normalize_edge_coords(text)==normalize_edge_coords(new)
              if counter[0] < 18: raise RuntimeError(f'{side}: too few changed points {counter[0]}')
              if not same_elsewhere: raise RuntimeError(f'{side}: unexpected non-coordinate change')
              report[side]={'changed_edge_blocks':changed_blocks,'changed_point_occurrences':counter[0],'only_edge_coordinate_content_changed':same_elsewhere,'source_sha256':hashlib.sha256(text.encode()).hexdigest(),'output_sha256':hashlib.sha256(new.encode()).hexdigest()}
          print('PCB_EDIT_REPORT='+json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SplitChoc64_Ver001.001_kicad_pcb_only
          path: out/*.kicad_pcb
          if-no-files-found: error
