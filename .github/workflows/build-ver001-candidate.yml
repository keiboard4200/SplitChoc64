name: Build Ver001 candidate package

on:
  push:
    paths:
      - '.github/workflows/build-ver001-candidate.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build development package from Ver000
        shell: bash
        env:
          LEFT_PATCH_GZ_B64: 
          RIGHT_PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          SRC='hardware/main-pcb/Ver000'
          DST='hardware/main-pcb/DEVELOPMENT/Ver001_candidate'
          rm -rf "$DST"
          mkdir -p "$(dirname "$DST")"
          cp -a "$SRC" "$DST"

          printf '%s' "$LEFT_PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/left.patch
          printf '%s' "$RIGHT_PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/right.patch
          patch "$DST/2_LEFT/SplitChoc64_LEFT.kicad_pcb" < /tmp/left.patch
          patch "$DST/1_RIGHT/SplitChoc64_RIGHT.kicad_pcb" < /tmp/right.patch

          # Do not carry stale manufacturing/plate/case outputs forward as if they were current.
          rm -rf "$DST/3_PLATE" "$DST/4_CASE" "$DST/5_MANIFUCTUR"
          mkdir -p "$DST/3_PLATE" "$DST/4_CASE" "$DST/5_MANIFUCTUR" "$DST/VALIDATION_STAGE"

          cat > "$DST/README.md" <<'EOF'
          # SplitChoc64 Ver001 candidate — DEVELOPMENT

          **Status: under development / not a formal release.**

          This directory is intentionally separated from formal `Ver000` and future formal `Ver001`.
          It contains the current DRC-clean PCB candidate while mechanical and connector changes are still pending.

          Current PCB baseline:
          - LEFT: final mating outline, H4 moved 3.0 mm left, user routing corrections, local silk fix.
          - RIGHT: final mating outline, user routing corrections, local silk fix.
          - DRC: user-confirmed 0 errors / 0 warnings on 2026-08-24 using the Ver000 project rule set.
          - Component placement, nets and schematic intent otherwise inherit Ver000 unless explicitly changed above.
          - KiCad project/schematic/library tables and referenced component 3D models are inherited from Ver000.

          Mating geometry:
          - Main seam key-center pitch accepted at approximately 20.05 mm.
          - Case inner wall target: PCB edge +0.2 mm clearance.
          - Case wall thickness target: 1.0 mm.

          ## Next development tasks
          1. Change J3/J4 to FFC connectors.
          2. Change the battery connector so the battery-side terminal does not need modification.
          3. Design the top plate as 3D-printable data.
          4. Define/design the bottom plate.

          Do not generate manufacturing data from this folder until these tasks are complete and DRC/mechanical checks are repeated.
          EOF

          cat > "$DST/3_PLATE/README_REGEN_REQUIRED.txt" <<'EOF'
          Plate data is intentionally not copied from Ver000 because the next development step is a new 3D-printable top plate and bottom-plate definition. Regenerate from the Ver001 candidate PCB geometry.
          EOF

          cat > "$DST/4_CASE/README_REGEN_REQUIRED.txt" <<'EOF'
          Ver000 case data is intentionally not presented as current. Current mechanical target: PCB-to-inner-wall clearance 0.2 mm, wall thickness 1.0 mm, accepted mating geometry at approximately 20.05 mm seam key pitch. Regenerate final case/plate data after connector changes.
          EOF

          cat > "$DST/5_MANIFUCTUR/README_REGENERATE.txt" <<'EOF'
          Manufacturing outputs from Ver000 are intentionally not copied into this development candidate. Regenerate Gerbers/drill/BOM/CPL only after the remaining connector and mechanical changes are complete and DRC returns 0/0 again.
          EOF

          cat > "$DST/VALIDATION_STAGE/DRC_STATUS.txt" <<'EOF'
          2026-08-24: DRC 0 errors / 0 warnings confirmed by the user after final local silk corrections. Historical DRC report files are intentionally not stored here.
          EOF

          cat > "$DST/VALIDATION_STAGE/NEXT_TASKS.txt" <<'EOF'
          NEXT CHAT / DEVELOPMENT PLAN
          1. J3/J4 -> FFC connectors.
          2. Battery connector -> type compatible with unmodified battery-side terminal.
          3. Top plate -> design as 3D-printable data.
          4. Bottom plate -> define/design.
          After each electrical change, preserve accepted mating outline unless mechanically required and rerun DRC.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DST"
          if git diff --cached --quiet; then
            echo 'No package changes.'
            exit 0
          fi
          git commit -m 'Add Ver001 development candidate package [skip ci]'
          git push
