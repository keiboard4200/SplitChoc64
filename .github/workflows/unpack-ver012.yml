name: Unpack Ver012 archive

on:
  push:
    branches:
      - unpack-ver012
    paths:
      - .github/workflows/unpack-ver012.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: unpack-ver012

      - name: Unpack and place Ver012
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ver012
          mkdir -p /tmp/ver012
          unzip -q splitchoc64_Ver012.zip -d /tmp/ver012

          base="hardware/main-pcb/Ver012"
          rm -rf "$base/source"

          # Preserve the original Ver012 directory structure directly under the
          # production baseline folder. Do not rename or modify design files.
          for d in 0_COMMON 1_RIGHT 2_LEFT 3_PLATE 4_CASE 5_MANIFUCTUR; do
            rm -rf "$base/$d"
            cp -a "/tmp/ver012/splitchoc64_Ver012/$d" "$base/$d"
          done
          cp -a /tmp/ver012/splitchoc64_Ver012/README.txt "$base/README_ORIGINAL.txt"
          cp -a /tmp/ver012/splitchoc64_Ver012/README_3D_AND_JLCPCB.txt "$base/README_3D_AND_JLCPCB.txt"

          # Keep prebuilt Ver012 JOY firmware separate from hardware sources.
          fw="firmware/joystick/releases/Ver012"
          rm -rf "$fw"
          mkdir -p "$fw"
          cp -a /tmp/ver012/firmware/. "$fw"/

          find "$base" -type f -print | LC_ALL=C sort > "$base/ARCHIVE_CONTENTS.txt"
          sha256sum splitchoc64_Ver012.zip > "$base/ARCHIVE_SHA256.txt"

      - name: Commit finalized Ver012 layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/main-pcb/Ver012 firmware/joystick/releases/Ver012
          git commit -m "Place Ver012 production sources and firmware" || exit 0
          git push origin HEAD:unpack-ver012
