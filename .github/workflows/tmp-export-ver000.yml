name: tmp-export-ver000
on:
  push:
    branches:
      - tmp/ver001-package-export
  pull_request:
    branches:
      - main
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage Ver000 hardware
        run: |
          mkdir -p export
          cp -a hardware/main-pcb/Ver000 export/Ver000
      - name: Upload Ver000 hardware
        uses: actions/upload-artifact@v4
        with:
          name: Ver000-hardware-export
          path: export/Ver000
          if-no-files-found: error
          retention-days: 1
