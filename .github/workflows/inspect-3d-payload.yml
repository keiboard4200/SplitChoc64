name: Inspect Ver001 3D payload

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.issue.title == 'TRIGGER_VER001_3D_PAYLOAD_INSPECTION'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and inspect payload
        shell: bash
        run: |
          set -euxo pipefail
          cat DEVELOPMENT/Ver001/.3d_payload/part*.b64 > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.xz
          xz -t /tmp/payload.xz
          xz -dc /tmp/payload.xz > /tmp/payload.raw
          echo "RAW_SIZE=$(stat -c%s /tmp/payload.raw)"
          file /tmp/payload.raw
          echo '--- first 128 bytes (hex) ---'
          xxd -l 128 /tmp/payload.raw
          echo '--- tar listing if archive ---'
          tar -tvf /tmp/payload.raw || true
          echo '--- strings head ---'
          strings /tmp/payload.raw | head -80 || true
