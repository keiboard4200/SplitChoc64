name: Apply XIAO pin-name fix

on:
  push:
    branches:
      - fix/xiao-nrf52840-plus-pin-names
    paths:
      - .github/workflows/apply-xiao-pinname-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xiao-nrf52840-plus-pin-names
          fetch-depth: 0

      - name: Apply reviewed pin-name-only changes
        shell: bash
        run: |
          echo '' | base64 -d | python

      - name: Ensure PCB and STEP data were untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hardware/main-pcb/Ver001/2_LEFT/SplitChoc64_LEFT.kicad_pcb)" = "f4d9ea4f736a971030b46df9c57ce9df1f895ebf"
          test "$(git hash-object hardware/main-pcb/Ver001/1_RIGHT/SplitChoc64_RIGHT.kicad_pcb)" = "dea28b0c6e13e364c5b489c4f8c7c8187acd633a"
          test "$(git hash-object hardware/main-pcb/Ver001/2_LEFT/3dmodels/xiao-nrf52840-plus-v2.step)" = "98db66e79b72cf0c05dadd099019ba547d7dd8ac"
          test "$(git hash-object hardware/main-pcb/Ver001/1_RIGHT/3dmodels/xiao-nrf52840-plus-v2.step)" = "98db66e79b72cf0c05dadd099019ba547d7dd8ac"

      - name: Commit reviewed delta and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-xiao-pinname-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/main-pcb/Ver001 .github/workflows/apply-xiao-pinname-fix.yml
          git diff --cached --check
          git commit -m "Fix XIAO nRF52840 Plus pin names"
          git push origin HEAD:fix/xiao-nrf52840-plus-pin-names
