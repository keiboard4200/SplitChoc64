CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_STEP=10
CONFIG_ZMK_BACKLIGHT_BRT_START=40
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_LED_GPIO=y
CONFIG_PINCTRL=y

# LEFT remains the split peripheral.
# Enter deep sleep after 30 minutes of inactivity.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Permanent standalone USB mode for LEFT.
# ZMK's CONFIG_ZMK_USB is intentionally unavailable to split peripherals, so
# enable the underlying Zephyr USB HID stack directly.  Board-local code adds
# the HID report path without changing LEFT's normal split role.
CONFIG_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_HID=y
