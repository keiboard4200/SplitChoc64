CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_STEP=10
CONFIG_ZMK_BACKLIGHT_BRT_START=40
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_LED_GPIO=y
CONFIG_PINCTRL=y

# LEFT remains the split peripheral.
# Enter deep sleep after 30 minutes of inactivity.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Permanent standalone USB mode for LEFT.
# xiao_ble//zmk defaults CONFIG_ZMK_USB=y, but ZMK intentionally forbids that
# host-side option on a split peripheral.  Override it explicitly and enable
# only Zephyr's legacy USB device/HID stack; board-local code supplies the
# local-only USB HID path without changing LEFT's split role.
CONFIG_ZMK_USB=n
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_HID=y
